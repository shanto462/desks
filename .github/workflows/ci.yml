name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, sign and lint
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # build-app.sh signs ad-hoc and never touches a keychain when CI is true.
      CI: "true"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
          sw_vers

      - name: Lint Info.plist
        run: plutil -lint Resources/Info.plist

      - name: Lint shell scripts
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          shellcheck --version
          shellcheck scripts/*.sh scripts/desks

      - name: Build (warnings are errors)
        # Swift warnings in our code and in the pinned dependencies fail the build.
        run: swift build -c release --arch arm64 --product Desks -Xswiftc -warnings-as-errors

      - name: Build and sign the app
        run: scripts/build-app.sh

      - name: Verify the signature
        run: |
          codesign --verify --deep --strict --verbose=2 build/Desks.app
          codesign -dv build/Desks.app 2>&1 | grep -E 'Identifier|flags'
          plutil -lint build/Desks.app/Contents/Info.plist
          test -d build/Desks.app/Contents/Resources/KeyboardShortcuts_KeyboardShortcuts.bundle

      - name: Check the command line tool
        run: |
          export DESKS_DRY_RUN=1
          scripts/desks help
          test "$(scripts/desks switch 3)" = "desks://switch/3"
          test "$(scripts/desks move 10)" = "desks://move/10"
          test "$(scripts/desks next --display 1A2B-3C4D)" = "desks://next?display=1A2B-3C4D"
          test "$(scripts/desks settings rules)" = "desks://settings/rules"
          test "$(scripts/desks switch 2 --display display-69733)" = "desks://switch/2?display=display-69733"
          for bad in "switch 0" "switch 11" "switch 03" "switch a" "bogus" "settings Rules" "rescue --display 1A2B-3C4D" "next 2" "next --display display-" "next --display display-1x" "next --display display--1"; do
            # shellcheck disable=SC2086
            if scripts/desks $bad >/dev/null 2>&1; then
              echo "expected failure: desks $bad"
              exit 1
            else
              test $? -eq 2 || { echo "expected exit code 2: desks $bad"; exit 1; }
            fi
          done

      - name: Zip the app
        run: ditto -c -k --keepParent build/Desks.app Desks-ci.zip

      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Desks-ci
          path: Desks-ci.zip
          retention-days: 7
          if-no-files-found: error
